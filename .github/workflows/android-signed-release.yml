name: Build Signed Tiba Supplies Office, Ras Sedr Branch, and Driver Android APKs

on:
  push:
    branches:
      - shadow/phase1-hardening
      - ui/dark-premium-final
    paths:
      - 'src/**'
      - 'native/android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'supabase/migrations/**'
      - 'supabase/functions/tiba-ai-assistant/**'
      - '.github/workflows/android-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: echo 'matrix={"app_mode":["office","branch","driver"]}' >> "$GITHUB_OUTPUT"

  build-signed-release:
    needs: select-builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app_mode: ${{ fromJson(needs.select-builds.outputs.matrix).app_mode }}
    env:
      VITE_APP_MODE: ${{ matrix.app_mode }}
      TIBA_APP_MODE: ${{ matrix.app_mode }}
      VITE_SUPABASE_URL: https://bvyxiahpxogblkmtjxyx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xiPfODQDOUSsTbgRQH9z6Q_izM6SFKn
      ANDROID_VERSION_CODE: 45
      ANDROID_VERSION_NAME: 1.0.45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TIBA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TIBA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIBA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIBA_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing for Android release signing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure TIBA_ANDROID_KEYSTORE_BASE64, TIBA_ANDROID_KEYSTORE_PASSWORD, TIBA_ANDROID_KEY_ALIAS, and TIBA_ANDROID_KEY_PASSWORD using the release signing key created for Tiba-Supplies."
            exit 1
          fi
          echo "Required signing secrets are present; secret values will not be logged."

      - name: Decode existing Android keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TIBA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tiba-release.keystore"
          test -s "$RUNNER_TEMP/tiba-release.keystore"
          echo "TIBA_KEYSTORE_PATH=$RUNNER_TEMP/tiba-release.keystore" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const mode = process.env.TIBA_APP_MODE;
          const office = mode === 'office';
          const branch = mode === 'branch';
          const config = {
            appId: office ? 'com.tibasupplies.office' : branch ? 'com.tibasupplies.branch' : 'com.tibasupplies.driver',
            appName: office ? 'Tiba Supplies Office' : branch ? 'Tiba Supplies Ras Sedr' : 'Tiba Supplies Driver',
            webDir: 'dist',
            android: { allowMixedContent: false, useLegacyBridge: mode === 'driver' }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2) + String.fromCharCode(10));
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Install native driver tracking service (driver APK only)
        if: matrix.app_mode == 'driver'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/app/src/main/java/com/tibasupplies/driver"
          mkdir -p "$TARGET"
          cp native/android/NativeDriverTrackingPlugin.java "$TARGET/"
          cp native/android/NativeDriverTrackingService.java "$TARGET/"
          MAIN="$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          if [ -z "$MAIN" ]; then
            echo "::error::Capacitor MainActivity.java was not found"
            exit 1
          fi
          MAIN_ACTIVITY="$MAIN" node <<'NODE'
          const fs = require('node:fs');
          const main = process.env.MAIN_ACTIVITY;
          let java = fs.readFileSync(main, 'utf8');
          if (!java.includes('NativeDriverTrackingPlugin.class')) {
            if (!java.includes('import android.os.Bundle;')) {
              java = java.replace(/(package [^;]+;\s*)/, '$1\nimport android.os.Bundle;');
            }
            if (java.includes('super.onCreate(savedInstanceState);')) {
              java = java.replace('super.onCreate(savedInstanceState);', 'registerPlugin(NativeDriverTrackingPlugin.class);\n        super.onCreate(savedInstanceState);');
            } else {
              java = java.replace(/}\s*$/, '    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(NativeDriverTrackingPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}\n');
            }
          }
          fs.writeFileSync(main, java);
          if (!fs.readFileSync(main, 'utf8').includes('registerPlugin(NativeDriverTrackingPlugin.class)')) {
            throw new Error('Could not register NativeDriverTrackingPlugin in MainActivity.');
          }
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const service = '<service android:name="com.tibasupplies.driver.NativeDriverTrackingService" android:enabled="true" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="location" />';
          if (!xml.includes('com.tibasupplies.driver.NativeDriverTrackingService')) {
            xml = xml.replace('</application>', '    ' + service + '\n  </application>');
          }
          fs.writeFileSync(file, xml);
          if (!fs.readFileSync(file, 'utf8').includes(service)) throw new Error('Native tracking service was not registered in AndroidManifest.xml');
          NODE
          grep -q 'registerPlugin(NativeDriverTrackingPlugin.class)' "$MAIN"
          echo "Native driver tracking plugin and service installed."

      - name: Declare and verify Android location, microphone, and media permissions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const permissions = [
            ['android.permission.ACCESS_COARSE_LOCATION', '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'],
            ['android.permission.ACCESS_FINE_LOCATION', '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'],
            ['android.permission.ACCESS_BACKGROUND_LOCATION', '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />'],
            ['android.permission.FOREGROUND_SERVICE', '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'],
            ['android.permission.FOREGROUND_SERVICE_LOCATION', '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />'],
            ['android.permission.POST_NOTIFICATIONS', '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'],
            ['android.permission.RECORD_AUDIO', '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'],
            ['android.permission.MODIFY_AUDIO_SETTINGS', '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'],
            ['android.permission.READ_EXTERNAL_STORAGE', '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'],
            ['android.permission.WRITE_EXTERNAL_STORAGE', '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'],
            ['android.permission.READ_MEDIA_IMAGES', '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'],
            ['android.permission.READ_MEDIA_VIDEO', '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />'],
            ['android.permission.READ_MEDIA_AUDIO', '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />']
          ];;
          const manifestTag = xml.match(/<manifest[^>]*>/);
          if (!manifestTag) throw new Error('AndroidManifest.xml manifest root tag was not found.');
          const manifestOpen = manifestTag.index + manifestTag[0].length - 1;
          const tags = permissions
            .filter(([permission]) => !xml.includes('android:name="' + permission + '"'))
            .map(([, tag]) => tag);
          if (tags.length) {
            xml = xml.slice(0, manifestOpen + 1) + '\n' + tags.join('\n') + xml.slice(manifestOpen + 1);
          }
          fs.writeFileSync(file, xml);
          const verified = fs.readFileSync(file, 'utf8');
          for (const [permission] of permissions) {
            if (!verified.includes('android:name="' + permission + '"')) {
              throw new Error('Required Android permission missing after insertion: ' + permission);
            }
          }
          console.log('Verified location, microphone, notifications, and media permissions in AndroidManifest.xml');
          NODE

      - name: Sync Android platform
        run: npx cap sync android

      - name: Configure release signing and version
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TIBA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIBA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIBA_ANDROID_KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re

          path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("Expected Android Groovy build file android/app/build.gradle was not generated.")
          text = path.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('TIBA_KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """
          if "signingConfigs {" not in text:
              if "    buildTypes {" not in text:
                  raise SystemExit("Could not safely locate buildTypes block; refusing to patch generated Gradle file.")
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          if not re.search(r"buildTypes\s*\{[\s\S]*?release\s*\{", text):
              raise SystemExit("Could not safely locate release build type; refusing to patch generated Gradle file.")
          text, count = re.subn(r"(buildTypes\s*\{[\s\S]*?release\s*\{)", r"\1\n            signingConfig signingConfigs.release", text, count=1)
          if count != 1:
              raise SystemExit("Could not add release signing configuration.")
          if "versionCode " in text:
              text = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ["ANDROID_VERSION_CODE"], text, count=1)
          else:
              text, count = re.subn(r"(defaultConfig\s*\{)", r"\1\n        versionCode " + os.environ["ANDROID_VERSION_CODE"], text, count=1)
              if count != 1:
                  raise SystemExit("Could not safely set Android versionCode.")
          if "versionName " in text:
              text = re.sub(r'versionName\s+"[^"]*"', 'versionName "' + os.environ["ANDROID_VERSION_NAME"] + '"', text, count=1)
          else:
              text, count = re.subn(r"(defaultConfig\s*\{)", r'\1\n        versionName "' + os.environ["ANDROID_VERSION_NAME"] + '"', text, count=1)
              if count != 1:
                  raise SystemExit("Could not safely set Android versionName.")
          path.write_text(text)
          print("Release signing and monotonically increasing version metadata configured.")
          PY

      - name: Verify Android application identity
        shell: bash
        run: |
          if [ "$TIBA_APP_MODE" = "office" ]; then
            EXPECTED="com.tibasupplies.office"
          elif [ "$TIBA_APP_MODE" = "branch" ]; then
            EXPECTED="com.tibasupplies.branch"
          else
            EXPECTED="com.tibasupplies.driver"
          fi
          grep -R -q "$EXPECTED" android/app/build.gradle android/app/src/main/AndroidManifest.xml || {
            echo "::error::Expected Android application identity was not found."
            exit 1
          }

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TIBA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIBA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIBA_ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Signed release APK was not produced."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool was not found; refusing to mark the APK verified."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          echo "Signed APK cryptographic verification passed for $TIBA_APP_MODE."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-supplies-${{ matrix.app_mode }}-signed-release-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
