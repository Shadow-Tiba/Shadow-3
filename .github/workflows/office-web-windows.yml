name: Build Tiba Supplies Shadow Office Web and Windows

on:
  push:
    branches:
      - shadow/phase1-hardening
      - ui/dark-premium-final
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'supabase/functions/tiba-ai-assistant/**'
      - '.github/workflows/office-web-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_APP_MODE: office
  VITE_SUPABASE_URL: https://bvyxiahpxogblkmtjxyx.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xiPfODQDOUSsTbgRQH9z6Q_izM6SFKn

jobs:
  build-web:
    name: Build Shadow office web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shadow branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build office web app
        run: npm run build
      - name: Verify Supabase configuration in bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'dist/assets';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.js'));
          if (!files.length) throw new Error('No JavaScript bundle found.');
          const bundle = files.map(f => fs.readFileSync(path.join(dir, f), 'utf8')).join('\\n');
          if (!bundle.includes(process.env.VITE_SUPABASE_URL)) throw new Error('Supabase URL missing from web bundle.');
          if (!bundle.includes(process.env.VITE_SUPABASE_PUBLISHABLE_KEY)) throw new Error('Supabase publishable key missing from web bundle.');
          console.log('Office web bundle contains the configured Supabase project URL and publishable key.');
          NODE
      - name: Upload Shadow office web build
        uses: actions/upload-artifact@v4
        with:
          name: tiba-supplies-shadow-office-web
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Shadow office Windows portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Shadow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build office web bundle
        run: npm run build
      - name: Verify Windows app bundle targets Tiba Shadow
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expectedUrl = process.env.VITE_SUPABASE_URL;
          const expectedKey = process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
          const files = fs.readdirSync('dist/assets').filter(f => f.endsWith('.js'));
          if (!files.length) throw new Error('No JavaScript bundle found.');
          const bundle = files.map(f => fs.readFileSync(path.join('dist/assets', f), 'utf8')).join('\\n');
          if (!bundle.includes(expectedUrl)) throw new Error('Tiba Shadow Supabase URL missing from Windows bundle.');
          if (!bundle.includes(expectedKey)) throw new Error('Configured Supabase publishable key missing from Windows bundle.');
          console.log('Verified Windows bundle target; publishable key value not logged.');
          NODE
      - name: Install Windows packaging tools
        run: npm install --no-save electron@^35.0.0 electron-builder@^26.0.0
      - name: Package Windows portable EXE
        run: npx electron-builder --config electron-builder.yml --win portable --x64
      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows portable EXE was not generated.' }
          Write-Host "Verified Windows app: $($exe.Name), $($exe.Length) bytes"
      - name: Upload Windows portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: tiba-supplies-shadow-office-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
