name: Phase 1 Shadow CI

on:
  push:
    branches:
      - shadow/phase1-hardening
  pull_request:
    branches:
      - shadow/phase1-hardening

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Phase 1 contract and authorization tests
        run: npm run test:phase1
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  baseline-postgres-smoke:
    name: Disposable PostgreSQL baseline smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create minimal Supabase Auth fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tiba_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          SQL
      - name: Apply clean baseline to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tiba_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261014190000_phase1_clean_baseline.sql
      - name: Assert core baseline tables exist
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tiba_test -v ON_ERROR_STOP=1 <<'SQL'
          do $assert$
          declare
            expected text[] := array['offices','app_users','factories','quarries','vehicle_owners','vehicles','drivers','load_orders','bookings','actual_loading_records','delivery_confirmations','driver_live_locations','notifications','audit_log'];
            missing text[];
            unprotected text[];
            exposed text[];
          begin
            select array_agg(t) into missing
            from unnest(expected) as t
            where to_regclass('public.' || t) is null;
            if missing is not null then
              raise exception 'BASELINE_TABLES_MISSING: %', array_to_string(missing, ', ');
            end if;

            select array_agg(t) into unprotected
            from unnest(expected) as t
            join pg_class c on c.oid = to_regclass('public.' || t)
            where not c.relrowsecurity;
            if unprotected is not null then
              raise exception 'BASELINE_RLS_DISABLED: %', array_to_string(unprotected, ', ');
            end if;

            select array_agg(t) into exposed
            from unnest(expected) as t
            where has_table_privilege('anon', 'public.' || t, 'SELECT')
               or has_table_privilege('authenticated', 'public.' || t, 'SELECT')
               or has_table_privilege('anon', 'public.' || t, 'INSERT')
               or has_table_privilege('authenticated', 'public.' || t, 'INSERT')
               or has_table_privilege('anon', 'public.' || t, 'UPDATE')
               or has_table_privilege('authenticated', 'public.' || t, 'UPDATE')
               or has_table_privilege('anon', 'public.' || t, 'DELETE')
               or has_table_privilege('authenticated', 'public.' || t, 'DELETE');
            if exposed is not null then
              raise exception 'BASELINE_TABLE_GRANTS_TOO_BROAD: %', array_to_string(exposed, ', ');
            end if;
          end $assert$;
          SQL

  clean-chain-postgres-smoke:
    name: Disposable PostgreSQL v191 clean-chain smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiba_chain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiba_chain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create minimal Supabase Auth and roles fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tiba_chain_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $uid$ select null::uuid $uid$;
          -- Minimal Supabase Storage fixture for migrations that configure private buckets and object policies.
          create schema storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text,
            name text
          );
          create function storage.foldername(name text) returns text[]
            language sql immutable as $folder$
              select (string_to_array(trim(both '/' from name), '/'))[1:1]
            $folder$;
          SQL
      - name: Apply reviewed v191 schema and RPC chain
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Replay every migration based on the clean v191 baseline in version order.
          # The pg_cron scheduler is intentionally excluded: it requires Supabase's managed extension/runtime.
          while IFS= read -r migration; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d tiba_chain_test -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done < <(
            python3 - <<'PY'
          from pathlib import Path
          import re
          baseline = 20261014190000
          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              match = re.match(r"^(\d+)_", path.name)
              if not match or int(match.group(1)) < baseline:
                  continue
              if path.name == "20261015186000_phase1_queue_scheduler.sql":
                  continue
              print(path.name)
          PY
          )
      - name: Assert v191 RPC and queue objects exist
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tiba_chain_test -v ON_ERROR_STOP=1 <<'SQL'
          do $chain$
          declare
            required_rpcs text[] := array[
              'driver_get_pending_assignments','driver_get_dispatch_state',
              'driver_get_portal_snapshot','driver_select_load','driver_confirm_delivery',
              'accept_direct_assignment','driver_update_live_location',
              'driver_confirm_arrival','driver_check_in_queue'
            ];
            missing text[];
          begin
            select array_agg(name) into missing
            from unnest(required_rpcs) name
            where not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname=name
            );
            if missing is not null then
              raise exception 'V191_RPC_MISSING: %', array_to_string(missing, ', ');
            end if;
            if to_regclass('public.driver_vehicle_assignments') is null
              or to_regclass('public.dispatch_windows') is null
              or to_regclass('public.waiting_list_entries') is null
              or to_regclass('public.driver_load_choices') is null then
              raise exception 'V191_QUEUE_OR_ASSIGNMENT_SCHEMA_MISSING';
            end if;
            if to_regclass('public.vehicle_driver_assignments') is not null then
              raise exception 'DUPLICATE_ASSIGNMENT_MODELS';
            end if;
          end $chain$;
          SQL

      - name: Run full v191 SQL contract gate
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tiba_chain_test -v ON_ERROR_STOP=1 -f supabase/tests/phase1_v191_contract_gate.sql
      - name: Run loaded-trip cancellation regression gate
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tiba_chain_test -v ON_ERROR_STOP=1 -f supabase/tests/phase1_loaded_trip_cancellation_checks.sql
